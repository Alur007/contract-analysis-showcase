<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rental evaluation report</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
    --risk-rot: #d03b3b; --risk-gelb: #fab219; --risk-gruen: #0ca30c;
    /* Sequential blue, low to high; in light mode low values recede toward the surface. */
    --seq: #cde2fb, #9ec5f4, #6da7ec, #3987e5, #256abf, #184f95, #0d366b;
    --seq-label-high: #ffffff;
    --seq-label-low: #0b0b0b;
    /* Ordinal blue for the scores 0, 1, 2 (validated with --ordinal). */
    --ord: #86b6ef, #2a78d6, #104281;
    /* Diverging: a score raised (blue) or lowered (red) by the reference list, grey if unchanged. */
    --div-raised: #2a78d6; --div-lowered: #e34948; --div-same: #c3c2b7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --series-5: #d55181; --series-6: #0ca30c; --series-7: #9085e9; --series-8: #e66767;
      /* In dark mode low values recede toward the dark surface. */
      --seq: #104281, #184f95, #256abf, #2a78d6, #3987e5, #6da7ec, #9ec5f4;
      --seq-label-high: #0b0b0b;
      --seq-label-low: #ffffff;
      --ord: #184f95, #3987e5, #9ec5f4;
      --div-raised: #3987e5; --div-lowered: #e66767; --div-same: #52514e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #0ca30c; --series-7: #9085e9; --series-8: #e66767;
    --seq: #104281, #184f95, #256abf, #2a78d6, #3987e5, #6da7ec, #9ec5f4;
    --seq-label-high: #0b0b0b;
    --seq-label-low: #ffffff;
    --ord: #184f95, #3987e5, #9ec5f4;
    --div-raised: #3987e5; --div-lowered: #e66767; --div-same: #52514e;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  header.page-header { padding: 32px 0 8px; }
  .eyebrow { margin: 0 0 4px; color: var(--ink-2); font-size: 13px; letter-spacing: 0.02em; }
  h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.2; font-weight: 650; }
  h2 { margin: 0 0 4px; font-size: 17px; line-height: 1.3; font-weight: 600; }
  .lead { margin: 0; color: var(--ink-2); max-width: 70ch; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-top: 16px; }
  /* Page tabs look like buttons: outlined, raised slightly, filled with ink when current. Neutral
     ink rather than a series colour, which already stands for a provider in the charts. */
  nav.pages { display: flex; flex-wrap: wrap; gap: 8px; }
  nav.pages a {
    color: var(--ink); text-decoration: none; padding: 7px 14px; border-radius: 8px; font-size: 14px; font-weight: 500;
    background: var(--surface); border: 1px solid var(--axis); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    transition: background-color 0.15s, border-color 0.15s;
  }
  nav.pages a:hover { background: var(--grid); border-color: var(--muted); }
  nav.pages a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  nav.pages a[aria-current="page"] { color: var(--surface); background: var(--ink); border-color: var(--ink); font-weight: 600; box-shadow: none; }
  .theme { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
  .theme select {
    font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 6px;
  }
  main { padding: 16px 0 32px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 16px; min-width: 0;
  }
  .card > p.how { margin: 0 0 12px; color: var(--ink-2); font-size: 14px; max-width: 75ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr)); gap: 16px; }
  .grid > .card { margin-bottom: 0; }
  .grid + .card, .grid + .grid { margin-top: 16px; }
  .chart-title { margin: 16px 0 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .chart { width: 100%; min-height: 40px; }
  .chart-scroll { overflow-x: auto; }
  .chart-error { color: var(--ink-2); font-size: 14px; padding: 8px 0; }
  .notes { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
  .notes li { margin: 2px 0; }
  .callout {
    border-left: 3px solid var(--axis); padding: 4px 0 4px 12px; margin: 0 0 16px;
    color: var(--ink-2); font-size: 14px; max-width: 85ch;
  }
  .callout p { margin: 4px 0; }
  .table-scroll { overflow-x: auto; margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; vertical-align: top; }
  th { color: var(--ink-2); font-weight: 600; white-space: normal; vertical-align: bottom; min-width: 64px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.wrap { white-space: normal; min-width: 160px; max-width: 280px; }
  td .sub { display: block; color: var(--muted); font-size: 12px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 0 0 12px; font-size: 14px; color: var(--ink-2); }
  .legend-title { font-weight: 600; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: var(--ink-2); border: 2px solid var(--ink-2); }
  .dot.hollow { background: transparent; }
  details { margin-top: 12px; }
  details > summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
  footer { color: var(--muted); font-size: 13px; padding: 8px 0 40px; }
  footer p { margin: 2px 0; }
  code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
  @media (max-width: 560px) {
    h1 { font-size: 23px; }
    .card { padding: 16px; }
  }
</style>

<script>
(function () {
  'use strict';

  const data = JSON.parse(document.getElementById('report-data').textContent);
  const SECTION_ORDER = ['Costs', 'Terms', 'Use', 'Maintenance', 'Duties', 'Privacy'];
  const RISK_LABEL = { Rot: 'Rot', Gelb: 'Gelb', Gruen: 'Grün' };
  const RISK_ORDER = ['Rot', 'Gelb', 'Gruen'];

  // ── Providers ────────────────────────────────────────────────────────────
  // Colour shows the provider, the same on every page; the model is named on each row. Known
  // providers keep fixed slots, so adding a provider never repaints the others.
  const PROVIDERS = [...new Set(['Nebius', 'OpenAI', 'Gemini', ...data.models.map(m => m.provider), ...(data.thesis?.contracts ?? []).map(c => c.provider)])];
  const providerSlot = provider => PROVIDERS.indexOf(provider) % 8;
  const providersOf = models => [...new Set(models.map(m => m.provider))].sort((a, b) => providerSlot(a) - providerSlot(b));
  const listText = items => items.length < 2 ? items.join('') : items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];

  // ── Pages ────────────────────────────────────────────────────────────────
  // A page lists the models it compares; a page is shown only if it has something to compare.
  // The LLM-judge page follows.
  const PAGES = [
    {
      id: 'nebius',
      nav: 'Nebius models',
      title: 'Nebius models: deterministic metrics',
      models: m => m.provider === 'Nebius',
      minProviders: 1,
      render: renderDeterministicPage,
    },
    {
      id: 'all',
      nav: 'All models',
      title: `All models: ${listText(providersOf(data.models))}`,
      models: () => true,
      minProviders: 2,
      render: renderDeterministicPage,
    },
    {
      id: 'judge',
      nav: 'LLM judge',
      title: 'LLM judge',
      models: m => data.judgeSections.some(s => s.model === m.model),
      minProviders: 1,
      render: renderJudgePage,
    },
    {
      id: 'variants',
      nav: 'Judge variants',
      title: 'Independent judge and judge with reference list',
      models: m => data.judgeSections.some(s => s.model === m.model && s.variant === 'Profile' && s.judged),
      minProviders: 1,
      render: renderVariantsPage,
    },
    {
      id: 'thesis',
      nav: 'Thesis (June 2026)',
      title: 'Thesis evaluation, June 2026',
      // Shown when the thesis results were imported (report --thesis-dir), whatever the current runs are.
      available: () => data.thesis != null,
      models: () => true,
      scope: () => thesisScope(),
      render: renderThesisPage,
    },
  ].filter(page => {
    if (page.available) return page.available();
    const models = data.models.filter(page.models);
    return models.length > 0 && providersOf(models).length >= page.minProviders;
  });

  // ── Formatting ───────────────────────────────────────────────────────────
  const pct = (v, digits = 1) => v == null ? '–' : (v * 100).toFixed(digits) + '%';
  const num = (v, digits = 0) => v == null ? '–' : Number(v).toLocaleString('en-US', { maximumFractionDigits: digits, minimumFractionDigits: digits });
  const compact = v => {
    if (v == null) return '–';
    return v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(Math.round(v));
  };
  const seconds = v => v == null ? '–' : Math.round(v) + ' s';

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value == null) continue;
      if (key === 'class') node.className = value;
      else node.setAttribute(key, value);
    }
    for (const child of children) {
      if (child == null) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  // ── Theme ────────────────────────────────────────────────────────────────
  function tokens() {
    const style = getComputedStyle(document.documentElement);
    const v = name => style.getPropertyValue(name).trim();
    return {
      surface: v('--surface'), ink: v('--ink'), ink2: v('--ink-2'), muted: v('--muted'),
      grid: v('--grid'), axis: v('--axis'),
      series: [1, 2, 3, 4, 5, 6, 7, 8].map(i => v('--series-' + i)),
      risk: { Rot: v('--risk-rot'), Gelb: v('--risk-gelb'), Gruen: v('--risk-gruen') },
      seq: v('--seq').split(',').map(s => s.trim()),
      ordinal: v('--ord').split(',').map(s => s.trim()),
      direction: { raised: v('--div-raised'), lowered: v('--div-lowered'), same: v('--div-same') },
      seqLabelHigh: v('--seq-label-high'), seqLabelLow: v('--seq-label-low'),
      dark: style.colorScheme === 'dark',
    };
  }

  function vegaConfig(t) {
    return {
      background: null,
      font: 'system-ui, -apple-system, "Segoe UI", sans-serif',
      view: { stroke: null },
      padding: { left: 0, right: 8, top: 4, bottom: 0 },
      axis: {
        domainColor: t.axis, tickColor: t.axis, gridColor: t.grid, gridWidth: 1,
        labelColor: t.ink2, titleColor: t.ink2, labelFontSize: 12, titleFontSize: 12, titleFontWeight: 500,
      },
      axisBand: { grid: false, domain: false, ticks: false, labelPadding: 8 },
      legend: { labelColor: t.ink2, titleColor: t.ink2, labelFontSize: 12, titleFontSize: 12, titleFontWeight: 500 },
      text: { color: t.ink },
    };
  }

  const THEME_KEY = 'evaluation-report-theme';
  function applyTheme(choice) {
    if (choice === 'light' || choice === 'dark') document.documentElement.setAttribute('data-theme', choice);
    else document.documentElement.removeAttribute('data-theme');
  }

  // ── Charts ───────────────────────────────────────────────────────────────
  const charts = [];

  /**
   * Registers a chart; specFor(tokens) builds its Vega-Lite spec for the current theme and width
   * (tokens.narrow). A chart with minWidth scrolls inside its card on narrow screens instead of
   * squeezing its labels together.
   */
  function chart(container, specFor, label, minWidth) {
    const node = el('div', { class: 'chart', role: 'img', 'aria-label': label });
    if (minWidth) {
      node.style.minWidth = minWidth + 'px';
      container.append(el('div', { class: 'chart-scroll' }, node));
    } else {
      container.append(node);
    }
    charts.push({ node, specFor, view: null });
  }

  const NARROW = 480;
  const labelLimit = t => t.narrow ? 110 : 220;

  async function drawCharts() {
    if (typeof vegaEmbed !== 'function') {
      for (const c of charts) {
        c.node.replaceChildren(el('p', { class: 'chart-error' },
          'The chart library could not be loaded (it comes from cdn.jsdelivr.net). The table below the chart has the same values.'));
        c.node.closest('.card')?.querySelector('details')?.setAttribute('open', '');
      }
      return;
    }
    const base = tokens();
    for (const c of charts) {
      c.view?.finalize();
      const t = { ...base, narrow: c.node.clientWidth < NARROW };
      c.narrow = t.narrow;
      const spec = c.specFor(t);
      spec.$schema = 'https://vega.github.io/schema/vega-lite/v5.json';
      spec.autosize = { type: 'fit-x', contains: 'padding' };
      spec.width = 'container';
      spec.config = vegaConfig(t);
      try {
        const result = await vegaEmbed(c.node, spec, { actions: false, renderer: 'svg', tooltip: { theme: t.dark ? 'dark' : 'light' } });
        c.view = result.view;
      } catch (error) {
        c.node.replaceChildren(el('p', { class: 'chart-error' }, 'This chart could not be drawn: ' + error.message));
      }
    }
  }

  /**
   * One metric per row of models: a dot per observation (run or contract) and a line at the
   * model's mean. offsetField spreads a model's dots over sub-rows (one per contract).
   */
  function stripSpec(t, { points, field, models, domain, format, axisFormat, title, offsetField, tooltip }) {
    const order = models.map(m => m.shortName);
    const values = points.filter(p => p[field] != null);
    const scale = () => domain ? { domain, nice: false } : { zero: true, nice: true };
    // Percent charts carry no axis title: the chart title above names the metric.
    const x = () => ({ field, type: 'quantitative', title: title || null, scale: scale(), axis: { format: axisFormat || format, tickCount: t.narrow ? 3 : 5 } });
    const step = offsetField ? 52 : 32;
    const position = () => {
      const encoding = { x: x() };
      if (offsetField) encoding.yOffset = { field: offsetField, type: 'nominal', scale: { paddingOuter: 0.4 } };
      return encoding;
    };
    return {
      // The step is per model row, not per contract sub-row.
      height: { step, for: 'position' },
      data: { values },
      encoding: { y: { field: 'shortName', type: 'nominal', sort: order, title: null, axis: { labelLimit: labelLimit(t) } } },
      layer: [
        {
          mark: { type: 'circle', size: 72, opacity: 0.85, stroke: t.surface, strokeWidth: 2 },
          encoding: {
            ...position(),
            color: { field: 'shortName', type: 'nominal', scale: { domain: order, range: models.map(m => m.color) }, legend: null },
          },
        },
        {
          // Transparent hit area, larger than the dot, carrying the tooltip.
          mark: { type: 'circle', size: 600, opacity: 0 },
          encoding: { ...position(), tooltip },
        },
        {
          mark: { type: 'tick', thickness: 2, size: step - 10, color: t.ink },
          encoding: {
            x: { aggregate: 'mean', field, type: 'quantitative', scale: scale() },
            tooltip: [
              { field: 'shortName', title: 'Model' },
              { aggregate: 'mean', field, type: 'quantitative', title: 'Mean', format },
            ],
          },
        },
      ],
    };
  }

  // ── Tables ───────────────────────────────────────────────────────────────
  /** columns: [{ title, value: row => text or node, num: right-aligned figures, wrap: text may wrap }] */
  function table(columns, rows, caption) {
    const head = el('tr', null, ...columns.map(c => el('th', { class: c.num ? 'num' : null, scope: 'col' }, c.title)));
    const body = rows.map(row => el('tr', null, ...columns.map(c => {
      let cellClass = null;
      if (c.num) cellClass = 'num';
      else if (c.wrap) cellClass = 'wrap';
      const cell = el('td', { class: cellClass });
      const value = c.value(row);
      if (value instanceof Node) cell.append(value); else cell.textContent = value;
      return cell;
    })));
    const t = el('table', null, caption ? el('caption', { style: 'position:absolute;left:-9999px' }, caption) : null,
      el('thead', null, head), el('tbody', null, ...body));
    return el('div', { class: 'table-scroll' }, t);
  }

  function tableDetails(columns, rows, caption) {
    return el('details', null, el('summary', null, 'Show the values as a table'), table(columns, rows, caption));
  }

  /**
   * Short name with its colour key; below it the model ID (the label without its settings, which
   * follow on their own line when asked for).
   */
  function modelCell(model, withSettings) {
    const settingsStart = model.model.indexOf(' (');
    const modelId = settingsStart > 0 ? model.model.slice(0, settingsStart) : model.model;
    return el('span', { title: model.model },
      el('span', { class: 'swatch', style: 'background:' + model.color, 'aria-hidden': 'true' }),
      model.shortName,
      modelId === model.shortName ? null : el('span', { class: 'sub' }, modelId),
      withSettings ? el('span', { class: 'sub' }, settings(model)) : null);
  }

  function card(parent, title, how) {
    const node = el('section', { class: 'card' }, el('h2', null, title), how ? el('p', { class: 'how' }, how) : null);
    parent.append(node);
    return node;
  }

  function chartTitle(parent, text) { parent.append(el('p', { class: 'chart-title' }, text)); }

  /**
   * The models of a page, grouped by provider, each with its provider's colour slot. Charts read the
   * slot's colour for the current theme on every draw, tables use the CSS variable, so both follow
   * a theme switch.
   */
  function modelsFor(page) {
    return data.models.filter(page.models)
      .map((m, index) => ({ ...m, index }))
      .sort((a, b) => providerSlot(a.provider) - providerSlot(b.provider) || a.index - b.index)
      .map(m => ({ ...m, slot: providerSlot(m.provider), color: `var(--series-${providerSlot(m.provider) + 1})` }));
  }

  function providerLegend(main, providers) {
    if (providers.length < 2) return;
    main.append(el('div', { class: 'legend', role: 'list', 'aria-label': 'Colour by provider' },
      el('span', { class: 'legend-title' }, 'Provider'),
      ...providers.map(p => el('span', { role: 'listitem' },
        el('span', { class: 'swatch', style: `background:var(--series-${providerSlot(p) + 1})`, 'aria-hidden': 'true' }), p))));
  }

  // ── Page: deterministic metrics ──────────────────────────────────────────
  function renderDeterministicPage(page, main) {
    const models = modelsFor(page);
    const withColors = t2 => models.map(m => ({ ...m, color: t2.series[m.slot] }));
    const byModel = Object.fromEntries(models.map(m => [m.model, m]));
    const runs = data.runs.filter(r => byModel[r.model]).map(r => ({
      ...r, shortName: byModel[r.model].shortName, concurrency: concurrencyOfRun(byModel[r.model], r),
    }));
    const providers = providersOf(models);

    // Temperature changes how much a model varies between repeats; where it differs, the
    // consistency rows name it.
    const temperatures = [...new Set(models.map(m => m.temperature))].sort((a, b) => a - b);
    const mixedTemperature = temperatures.length > 1;
    const rowLabel = m => mixedTemperature ? `${m.shortName} · temp ${m.temperature}` : m.shortName;
    const cases = data.casePoints.filter(c => byModel[c.model]).map(c => ({ ...c, shortName: rowLabel(byModel[c.model]) }));
    const withTemperature = t2 => withColors(t2).map(m => ({ ...m, shortName: rowLabel(m) }));

    providerLegend(main, providers);

    // Summary table
    const summary = card(main, 'Summary',
      'Means over the contracts, as in modes.csv. Each chart below shows the spread behind these numbers.' +
      (mixedTemperature ? ' The models ran at different temperatures; read the two consistency columns with the note under Stability across repeats.' : ''));
    summary.append(table([
      { title: 'Model', wrap: true, value: m => modelCell(m, true) },
      { title: 'Runs', num: true, value: m => num(m.score.runs) },
      { title: 'Failed sections', num: true, value: m => num(m.score.sections.failed) },
      { title: 'Core coverage', num: true, value: m => pct(m.score.meanCoreCoverage) },
      { title: 'Weighted score', num: true, value: m => pct(m.score.meanWeightedScore) },
      { title: 'riskLevel consistency', num: true, value: m => pct(m.score.meanRiskConsistency) },
      { title: 'Citation Jaccard', num: true, value: m => pct(m.score.meanCitationJaccard) },
      { title: 'Quotes traceable', num: true, value: m => pct(m.score.quotes?.traceableRate) },
      { title: 'Passages found', num: true, value: m => pct(m.score.quotes?.passageFoundRate) },
      { title: 'Guardrail hits / run', num: true, value: m => num(m.score.meanGuardrailViolations, 2) },
      { title: 'Output tokens', num: true, value: m => compact(m.score.meanOutputTokens) },
      { title: 'Duration', num: true, value: m => seconds(m.score.meanDurationSeconds) },
    ], models, 'Summary per model'));

    const runTooltip = (field, title) => [
      { field: 'shortName', title: 'Model' },
      { field: 'caseId', title: 'Contract' },
      { field: 'repeat', title: 'Repeat' },
      { field, title, format: '.1%' },
    ];

    const grid1 = el('div', { class: 'grid' });
    main.append(grid1);

    // Coverage
    const coverage = card(grid1, 'Reference coverage',
      'Share of the expected references cited, per run. Each dot is one run; the dark line is the model\'s mean. ' +
      'Within a model the rows are the contracts, ' + data.cases.map(c => c.caseId).join(', ') + ' from top to bottom.');
    chartTitle(coverage, 'Core coverage');
    chart(coverage, t2 => stripSpec(t2, { points: runs, field: 'coreCoverage', models: withColors(t2), domain: [0, 1], format: '.1%', axisFormat: '.0%', offsetField: 'caseId', tooltip: runTooltip('coreCoverage', 'Core coverage') }), 'Core coverage per run and model');
    chartTitle(coverage, 'Weighted score (core, supporting, conditional, minus irrelevant)');
    chart(coverage, t2 => stripSpec(t2, { points: runs, field: 'weightedScore', models: withColors(t2), domain: [0, 1], format: '.1%', axisFormat: '.0%', offsetField: 'caseId', tooltip: runTooltip('weightedScore', 'Weighted score') }), 'Weighted score per run and model');
    coverage.append(tableDetails([
      { title: 'Model', value: r => r.shortName }, { title: 'Contract', value: r => r.caseId }, { title: 'Repeat', num: true, value: r => r.repeat },
      { title: 'Core coverage', num: true, value: r => pct(r.coreCoverage) }, { title: 'Weighted score', num: true, value: r => pct(r.weightedScore) },
      { title: 'Failed sections', num: true, value: r => r.failedSections },
    ], runs, 'Coverage per run'));

    // Quotes
    const quotes = card(grid1, 'Quote traceability',
      data.quotesTraced
        ? 'Whether the Zitat occurs in the contract. A quote is traceable only if all its passages are found; ' +
          'passages found is the share an original-file viewer could highlight.'
        : 'Not computed: the report was built without the case set (report --cases), so the quotes could not be traced.');
    if (data.quotesTraced) {
      chartTitle(quotes, 'Whole quotes traceable');
      chart(quotes, t2 => stripSpec(t2, { points: runs, field: 'quoteTraceableRate', models: withColors(t2), domain: [0, 1], format: '.1%', axisFormat: '.0%', offsetField: 'caseId', tooltip: runTooltip('quoteTraceableRate', 'Quotes traceable') }), 'Share of traceable quotes per run');
      chartTitle(quotes, 'Passages found');
      chart(quotes, t2 => stripSpec(t2, { points: runs, field: 'passageFoundRate', models: withColors(t2), domain: [0, 1], format: '.1%', axisFormat: '.0%', offsetField: 'caseId', tooltip: runTooltip('passageFoundRate', 'Passages found') }), 'Share of quote passages found per run');
      quotes.append(tableDetails([
        { title: 'Model', value: r => r.shortName }, { title: 'Contract', value: r => r.caseId }, { title: 'Repeat', num: true, value: r => r.repeat },
        { title: 'Quotes traceable', num: true, value: r => pct(r.quoteTraceableRate) }, { title: 'Passages found', num: true, value: r => pct(r.passageFoundRate) },
      ], runs, 'Quote traceability per run'));
    }

    const grid2 = el('div', { class: 'grid' });
    main.append(grid2);

    // Stability
    const stability = card(grid2, 'Stability across repeats',
      'Computed per contract over its repeated runs, so each dot is one contract. riskLevel consistency is the share of sections ' +
      'rated the same in every run; citation Jaccard is the mean overlap of the cited references between runs.');
    if (mixedTemperature) {
      const groups = temperatures.map(t => `${t} for ${listText(models.filter(m => m.temperature === t).map(m => m.shortName))}`);
      stability.append(el('div', { class: 'callout' },
        el('p', null, `Temperatures differ: ${groups.join('; ')}. A higher temperature lets a model vary more between repeats, ` +
          'so these two charts favour the models at the lower temperature. Coverage, quotes and cost are less affected.')));
    }
    const caseTooltip = (field, title) => [
      { field: 'shortName', title: 'Model' }, { field: 'caseId', title: 'Contract' }, { field: 'runs', title: 'Runs' },
      { field, title, format: '.1%' },
    ];
    chartTitle(stability, 'riskLevel consistency');
    chart(stability, t2 => stripSpec(t2, { points: cases, field: 'riskLevelConsistency', models: withTemperature(t2), domain: [0, 1], format: '.1%', axisFormat: '.0%', tooltip: caseTooltip('riskLevelConsistency', 'riskLevel consistency') }), 'riskLevel consistency per contract');
    chartTitle(stability, 'Citation Jaccard');
    chart(stability, t2 => stripSpec(t2, { points: cases, field: 'citationJaccard', models: withTemperature(t2), domain: [0, 1], format: '.1%', axisFormat: '.0%', tooltip: caseTooltip('citationJaccard', 'Citation Jaccard') }), 'Citation Jaccard per contract');
    stability.append(tableDetails([
      { title: 'Model', value: c => c.shortName }, { title: 'Contract', value: c => c.caseId }, { title: 'Runs', num: true, value: c => c.runs },
      { title: 'riskLevel consistency', num: true, value: c => pct(c.riskLevelConsistency) }, { title: 'Comparable sections', num: true, value: c => c.comparableSections },
      { title: 'Citation Jaccard', num: true, value: c => pct(c.citationJaccard) },
      { title: 'Overall rating stable', value: c => c.overallRatingStable == null ? '–' : (c.overallRatingStable ? 'yes' : 'no') },
    ], cases, 'Stability per contract'));

    // Section ratings
    const ratings = card(grid2, 'Section ratings',
      'Share of rated sections per riskLevel, over all runs. Failed sections have no rating and are left out.');
    const riskRows = data.riskLevels.filter(r => byModel[r.model]).map(r => {
      const total = data.riskLevels.filter(x => x.model === r.model).reduce((s, x) => s + x.sections, 0);
      return { ...r, shortName: byModel[r.model].shortName, label: RISK_LABEL[r.riskLevel], order: RISK_ORDER.indexOf(r.riskLevel), share: total ? r.sections / total : null };
    });
    chart(ratings, t2 => ({
      height: { step: 36 },
      data: { values: riskRows.filter(r => r.sections > 0) },
      mark: { type: 'bar', size: 20, stroke: t2.surface, strokeWidth: 2 },
      encoding: {
        y: { field: 'shortName', type: 'nominal', sort: models.map(m => m.shortName), title: null, axis: { labelLimit: labelLimit(t2) } },
        x: { field: 'sections', type: 'quantitative', stack: 'normalize', title: 'Share of rated sections', axis: { format: '.0%', tickCount: 5 } },
        color: {
          field: 'label', type: 'nominal',
          scale: { domain: RISK_ORDER.map(r => RISK_LABEL[r]), range: RISK_ORDER.map(r => t2.risk[r]) },
          legend: { title: null, orient: 'top', direction: 'horizontal' },
        },
        order: { field: 'order' },
        tooltip: [
          { field: 'shortName', title: 'Model' }, { field: 'label', title: 'riskLevel' },
          { field: 'sections', title: 'Sections' }, { field: 'share', title: 'Share', format: '.1%' },
        ],
      },
    }), 'Share of section ratings per model');
    ratings.append(tableDetails([
      { title: 'Model', value: m => m.shortName },
      ...RISK_ORDER.map(level => ({
        title: RISK_LABEL[level], num: true,
        value: m => { const r = riskRows.find(x => x.model === m.model && x.riskLevel === level); return r ? `${r.sections} (${pct(r.share, 0)})` : '–'; },
      })),
    ], models, 'Section ratings per model'));

    // Coverage by section
    const sections = card(main, 'Core coverage by section',
      'Mean core coverage per section over all runs. The colour scale starts at 50%; lower values take its lightest step.');
    const cells = data.sectionCoverage.filter(s => byModel[s.model] && s.meanCoreCoverage != null)
      .map(s => ({ ...s, shortName: byModel[s.model].shortName }));
    chart(sections, t2 => ({
      height: { step: 40 },
      data: { values: cells },
      encoding: {
        x: { field: 'section', type: 'nominal', sort: SECTION_ORDER, title: null, axis: { orient: 'top', labelAngle: 0, domain: false, ticks: false } },
        // This chart keeps a minimum width (it scrolls on phones), so it keeps a fixed label width too.
        y: { field: 'shortName', type: 'nominal', sort: models.map(m => m.shortName), title: null, axis: { labelLimit: 160 } },
      },
      layer: [
        {
          mark: { type: 'rect', stroke: t2.surface, strokeWidth: 2, cornerRadius: 4 },
          encoding: {
            color: {
              field: 'meanCoreCoverage', type: 'quantitative',
              scale: { domain: [0.5, 1], range: t2.seq, clamp: true },
              legend: { title: 'Mean core coverage', format: '.0%', values: [0.5, 0.75, 1], orient: 'bottom', gradientLength: 220, direction: 'horizontal' },
            },
            tooltip: [
              { field: 'shortName', title: 'Model' }, { field: 'section', title: 'Section' },
              { field: 'meanCoreCoverage', title: 'Mean core coverage', format: '.1%' }, { field: 'scoredSections', title: 'Sections scored' },
            ],
          },
        },
        {
          mark: { type: 'text', fontSize: 12 },
          encoding: {
            text: { field: 'meanCoreCoverage', type: 'quantitative', format: '.0%' },
            color: { condition: { test: 'datum.meanCoreCoverage >= 0.8', value: t2.seqLabelHigh }, value: t2.seqLabelLow },
          },
        },
      ],
    }), 'Mean core coverage per section and model', 640);
    sections.append(tableDetails([
      { title: 'Model', value: m => m.shortName },
      ...SECTION_ORDER.map(section => ({
        title: section, num: true,
        value: m => { const s = data.sectionCoverage.find(x => x.model === m.model && x.section === section); return s && s.meanCoreCoverage != null ? `${pct(s.meanCoreCoverage)} (n ${s.scoredSections})` : '–'; },
      })),
    ], models, 'Core coverage per section'));

    // Cost
    const cost = card(main, 'Cost per run',
      'Output tokens include reasoning tokens. Duration is the whole analysis of one contract, six sections and the summary; ' +
      'it depends on the provider\'s load and on how many calls ran at once, so compare it with care.');
    const costTooltip = (field, title, format) => [
      { field: 'shortName', title: 'Model' }, { field: 'caseId', title: 'Contract' }, { field: 'repeat', title: 'Repeat' },
      { field, title, format },
    ];
    const costGrid = el('div', { class: 'grid' });
    const tokensBox = el('div'), durationBox = el('div');
    costGrid.append(tokensBox, durationBox);
    cost.append(costGrid);
    chartTitle(tokensBox, 'Output tokens per run');
    chart(tokensBox, t2 => stripSpec(t2, { points: runs, field: 'outputTokens', models: withColors(t2), format: ',.0f', axisFormat: '~s', title: 'Output tokens', offsetField: 'caseId', tooltip: costTooltip('outputTokens', 'Output tokens', ',.0f') }), 'Output tokens per run');
    chartTitle(durationBox, 'Duration per run');
    chart(durationBox, t2 => stripSpec(t2, { points: runs, field: 'durationSeconds', models: withColors(t2), format: '.0f', axisFormat: 'd', title: 'Seconds', offsetField: 'caseId', tooltip: [...costTooltip('durationSeconds', 'Seconds', '.0f'), { field: 'concurrency', title: 'Calls at once' }] }), 'Duration per run in seconds');
    cost.append(tableDetails([
      { title: 'Model', value: r => r.shortName }, { title: 'Contract', value: r => r.caseId }, { title: 'Repeat', num: true, value: r => r.repeat },
      { title: 'Output tokens', num: true, value: r => num(r.outputTokens) }, { title: 'Duration', num: true, value: r => seconds(r.durationSeconds) },
      { title: 'Calls at once', value: r => r.concurrency },
    ], runs, 'Cost per run'));

    // Reading notes
    const notes = card(main, 'How to read this page');
    notes.append(el('ul', { class: 'notes' },
      providers.length > 1 ? el('li', null, 'Colour shows the provider; each row names the model.') : null,
      el('li', null, `Mode ${data.mode}. In GraphProfile the graph returns exactly the references the coverage metric expects, so coverage mainly shows whether a model uses the references it was given.`),
      el('li', null, 'Consistency needs repeats, and it is computed per contract: with three contracts, each model has three values, so small differences are not meaningful.'),
      mixedTemperature ? el('li', null, 'The models ran at different temperatures (see Stability across repeats); the consistency comparison between them is limited.') : null,
      el('li', null, 'All scores are deterministic and computed by the evaluation tool from the stored runs; no LLM judge is involved on this page.'),
    ));
  }

  // ── Page: LLM judge ──────────────────────────────────────────────────────
  const DIMENSIONS = [
    { key: 'legalReference', label: 'LegalReference' },
    { key: 'clauseCitationAccuracy', label: 'ClauseCitationAccuracy' },
    { key: 'irac', label: 'IRAC' },
  ];
  const VARIANT_LABEL = { Independent: 'independent', Profile: 'with reference list' };
  const JUDGE_SLOTS = [6, 3, 4, 7];  // violet, yellow, then magenta and red; validated as a pair for the first two
  const JUDGE_SHAPES = ['circle', 'diamond', 'square', 'triangle-up'];
  const score = v => v == null ? '–' : Number(v).toFixed(2);
  const mean = values => {
    const present = values.filter(v => v != null);
    return present.length ? present.reduce((s, v) => s + v, 0) / present.length : null;
  };

  /**
   * The judge page. A context holds what every card needs: the page's models, the judged sections,
   * and the judges, led by the one that scored the most generator models. Judge scores never mix.
   */
  function renderJudgePage(page, main) {
    const models = modelsFor(page);
    const byModel = Object.fromEntries(models.map(m => [m.model, m]));
    const sections = data.judgeSections.filter(s => byModel[s.model]).map(s => ({ ...s, shortName: byModel[s.model].shortName }));
    const judges = orderedJudges(sections);

    const ctx = {
      models, byModel, sections, judges,
      primary: judges[0],
      withColors: t2 => models.map(m => ({ ...m, color: t2.series[m.slot] })),
      judgeSlot: j => JUDGE_SLOTS[judges.indexOf(j) % JUDGE_SLOTS.length],
      judgeShape: j => JUDGE_SHAPES[judges.indexOf(j) % JUDGE_SHAPES.length],
      of: (judge, variant) => sections.filter(s => s.judgeModel === judge && s.variant === variant && s.judged),
    };
    ctx.runRows = { Independent: judgeRunRows(ctx, 'Independent'), Profile: judgeRunRows(ctx, 'Profile') };

    providerLegend(main, providersOf(models));
    judgeAboutCard(ctx, main);
    judgeSummaryCard(ctx, main);
    judgePerRunCard(ctx, main);
    judgeBySectionCard(ctx, main);

    const grid = el('div', { class: 'grid' });
    main.append(grid);
    judgeScaleCard(ctx, grid);
    judgeCoverageCard(ctx, grid);

    for (const m of models) {
      const ownJudges = judges.filter(j => ctx.of(j, 'Independent').some(s => s.model === m.model));
      if (ownJudges.length > 1) renderJudgeComparison(ctx, main, m, ownJudges);
    }

    card(main, 'How to read this page').append(el('ul', { class: 'notes' },
      el('li', null, 'Judge scores are diagnostic: an LLM\'s reading of the analysis, kept apart from the deterministic metrics on the other pages.'),
      el('li', null, 'Compare models within one judge and one variant. A model scored lower by a stricter judge is not worse than a model scored higher by a lenient one.'),
      PAGES.some(p => p.id === 'variants')
        ? el('li', null, 'The independent judge and the variant with the reference list are compared on the ', el('a', { href: '#variants' }, 'Judge variants'), ' page.')
        : null,
      el('li', null, 'The judges\' findings quote the contracts, so the report shows only how many there were; they are in the judge result files.'),
    ));
  }

  /** The judge that scored the most generator models first, then by name; judge scores never mix. */
  function orderedJudges(sections) {
    return [...new Set(sections.map(s => s.judgeModel))]
      .map(name => ({ name, models: new Set(sections.filter(s => s.judgeModel === name).map(s => s.model)).size }))
      .sort((a, b) => b.models - a.models || a.name.localeCompare(b.name))
      .map(j => j.name);
  }

  /** Per-run means of the primary judge: the mean of each run's judged sections. */
  function judgeRunRows(ctx, variant) {
    const byRun = new Map();
    for (const s of ctx.of(ctx.primary, variant)) {
      if (!byRun.has(s.runId)) byRun.set(s.runId, []);
      byRun.get(s.runId).push(s);
    }
    return [...byRun.values()].map(list => ({
      runId: list[0].runId, shortName: list[0].shortName, caseId: list[0].caseId, repeat: list[0].repeat,
      legalReference: mean(list.map(s => s.legalReference)),
      clauseCitationAccuracy: mean(list.map(s => s.clauseCitationAccuracy)),
      irac: mean(list.map(s => s.irac)),
      overall: mean(list.map(s => s.overall)),
    }));
  }

  function judgeAboutCard(ctx, main) {
    const judgedBy = ctx.judges.map(j =>
      `${j} judged ${listText(ctx.models.filter(m => ctx.sections.some(s => s.judgeModel === j && s.model === m.model)).map(m => m.shortName))}`);
    card(main, 'About these scores').append(el('ul', { class: 'notes' },
      el('li', null, 'An LLM judge scored each section from 0 to 2: LegalReference (the right provisions, correctly applied), ' +
        'ClauseCitationAccuracy (the Zitat fits the topic and supports the Bewertung) and IRAC (issue, rule, application and conclusion are coherent). Overall is their mean.'),
      el('li', null, 'Two variants: the independent judge, and one that sees the expected references for LegalReference only. They are reported side by side, never averaged.'),
      el('li', null, `${judgedBy.join('; ')}.`),
      el('li', null, 'Judge scores compare only within one judge: judges use the scale differently. The judges\' legal findings have not been checked by a lawyer.'),
    ));
  }

  function judgeSummaryCard(ctx, main) {
    const { byModel, judges, models } = ctx;
    const rows = data.judgeSummaries
      .filter(s => byModel[s.score.model])
      .sort((a, b) => judges.indexOf(a.judgeModel) - judges.indexOf(b.judgeModel) || a.variant.localeCompare(b.variant)
        || models.indexOf(byModel[a.score.model]) - models.indexOf(byModel[b.score.model]));
    const withRate = (meanValue, rate) => `${score(meanValue)} (${pct(rate, 0)})`;
    card(main, 'Summary',
      'Means over the runs (0 to 2), as in judge_modes.csv, with the full-score rate in brackets: the share of sections the judge scored 2, ' +
      'i.e. found nothing to fault. The rate is a proportion like the deterministic metrics; the mean divided by 2 would not be, ' +
      'because the rubric levels are ordinal. Findings are the reasons the judge gave for scores below 2.').append(table([
      { title: 'Judge', value: s => s.judgeModel },
      { title: 'Variant', value: s => VARIANT_LABEL[s.variant] },
      { title: 'Model', wrap: true, value: s => modelCell(byModel[s.score.model]) },
      { title: 'Judged sections', num: true, value: s => num(s.score.judgedSections) },
      { title: 'Not judged', num: true, value: s => num(s.score.notJudgedSections) },
      { title: 'LegalReference (full score)', num: true, value: s => withRate(s.score.meanLegalReferenceScore, s.score.fullScoreLegalReferenceRate) },
      { title: 'ClauseCitationAccuracy (full score)', num: true, value: s => withRate(s.score.meanClauseCitationAccuracyScore, s.score.fullScoreClauseCitationAccuracyRate) },
      { title: 'IRAC (full score)', num: true, value: s => withRate(s.score.meanIracScore, s.score.fullScoreIracRate) },
      { title: 'Overall', num: true, value: s => score(s.score.meanOverallScore) },
      { title: 'Findings major / minor', num: true, value: s => `${s.majorFindings + s.criticalFindings} / ${s.minorFindings}` },
    ], rows, 'Judge scores per judge, variant and model'));
  }

  function judgePerRunCard(ctx, main) {
    const perRun = card(main, `Scores per run: ${ctx.primary}`,
      'Each dot is one run, the mean of its judged sections; the dark line is the model\'s mean. Left the independent judge, right the variant with the reference list.');
    const pairs = el('div', { class: 'grid' });
    perRun.append(pairs);
    const variants = ['Independent', 'Profile'].filter(v => ctx.runRows[v].length > 0);
    for (const dim of [...DIMENSIONS, { key: 'overall', label: 'Overall' }]) {
      for (const variant of variants) {
        const box = el('div');
        pairs.append(box);
        chartTitle(box, `${dim.label} · ${VARIANT_LABEL[variant]}`);
        chart(box, t2 => stripSpec(t2, {
          points: ctx.runRows[variant], field: dim.key, models: ctx.withColors(t2), domain: [0, 2], format: '.2f', axisFormat: '.1f',
          offsetField: 'caseId',
          tooltip: [{ field: 'shortName', title: 'Model' }, { field: 'caseId', title: 'Contract' }, { field: 'repeat', title: 'Repeat' }, { field: dim.key, title: dim.label, format: '.2f' }],
        }), `${dim.label} per run, ${VARIANT_LABEL[variant]} judge`);
      }
    }
    perRun.append(tableDetails([
      { title: 'Variant', value: r => VARIANT_LABEL[r.variant] }, { title: 'Model', value: r => r.shortName },
      { title: 'Contract', value: r => r.caseId }, { title: 'Repeat', num: true, value: r => r.repeat },
      ...DIMENSIONS.map(d => ({ title: d.label, num: true, value: r => score(r[d.key]) })),
      { title: 'Overall', num: true, value: r => score(r.overall) },
    ], variants.flatMap(v => ctx.runRows[v].map(r => ({ ...r, variant: v }))), 'Judge scores per run'));
  }

  /** Mean score per section of the given sections, for each dimension. */
  function sectionMeans(sections) {
    const means = [];
    for (const dim of DIMENSIONS) {
      for (const section of SECTION_ORDER) {
        const values = sections.filter(s => s.section === section).map(s => s[dim.key]);
        if (values.length) means.push({ dimension: dim.label, section, value: mean(values), n: values.length });
      }
    }
    return means;
  }

  function judgeBySectionCard(ctx, main) {
    const bySection = card(main, `By section: ${ctx.primary}, independent`,
      'Mean score per section over all runs, for each model and dimension, from 0 to 2 (colour scale below the chart).');
    const cells = ctx.models.flatMap(m =>
      sectionMeans(ctx.of(ctx.primary, 'Independent').filter(s => s.model === m.model))
        .map(c => ({ ...c, model: m.shortName, row: `${m.shortName} · ${c.dimension}` })));
    const rowOrder = [...new Set(cells.map(c => c.row))];
    chart(bySection, t2 => ({
      height: { step: 32 },
      data: { values: cells },
      encoding: {
        x: { field: 'section', type: 'nominal', sort: SECTION_ORDER, title: null, axis: { orient: 'top', labelAngle: 0, domain: false, ticks: false } },
        y: { field: 'row', type: 'nominal', sort: rowOrder, title: null, axis: { labelLimit: 260 } },
      },
      layer: [
        {
          mark: { type: 'rect', stroke: t2.surface, strokeWidth: 2, cornerRadius: 4 },
          encoding: {
            color: { field: 'value', type: 'quantitative', scale: { domain: [0, 2], range: t2.seq }, legend: { title: 'Mean score', format: '.1f', values: [0, 1, 2], orient: 'bottom', gradientLength: 220, direction: 'horizontal' } },
            tooltip: [{ field: 'model', title: 'Model' }, { field: 'dimension', title: 'Dimension' }, { field: 'section', title: 'Section' }, { field: 'value', title: 'Mean', format: '.2f' }, { field: 'n', title: 'Runs' }],
          },
        },
        {
          mark: { type: 'text', fontSize: 12 },
          encoding: {
            text: { field: 'value', type: 'quantitative', format: '.2f' },
            color: { condition: { test: 'datum.value >= 1.2', value: t2.seqLabelHigh }, value: t2.seqLabelLow },
          },
        },
      ],
    }), 'Mean judge score per section, model and dimension', 760);
    bySection.append(tableDetails([
      { title: 'Model', value: c => c.model }, { title: 'Dimension', value: c => c.dimension }, { title: 'Section', value: c => c.section },
      { title: 'Mean', num: true, value: c => score(c.value) }, { title: 'Runs', num: true, value: c => c.n },
    ], cells, 'Mean judge score per section'));
  }

  function judgeScaleCard(ctx, parent) {
    const scale = card(parent, 'How each judge uses the scale',
      'How often each score was given, over the three dimensions of every judged section (independent variant).');
    const rows = ctx.judges.flatMap(judge => ctx.models.flatMap(m => {
      const values = ctx.of(judge, 'Independent').filter(s => s.model === m.model).flatMap(s => DIMENSIONS.map(d => s[d.key]));
      if (values.length === 0) return [];
      return [0, 1, 2].map(value => {
        const count = values.filter(v => v === value).length;
        return { row: `${judge} · ${m.shortName}`, judge, model: m.shortName, score: String(value), count, share: count / values.length };
      });
    }));
    chart(scale, t2 => ({
      height: { step: 36 },
      data: { values: rows.filter(r => r.count > 0) },
      mark: { type: 'bar', size: 20, stroke: t2.surface, strokeWidth: 2 },
      encoding: {
        y: { field: 'row', type: 'nominal', sort: [...new Set(rows.map(r => r.row))], title: null, axis: { labelLimit: labelLimit(t2) + 60 } },
        x: { field: 'count', type: 'quantitative', stack: 'normalize', title: 'Share of scores', axis: { format: '.0%', tickCount: 5 } },
        color: { field: 'score', type: 'ordinal', scale: { domain: ['0', '1', '2'], range: t2.ordinal }, legend: { title: 'Score', orient: 'top', direction: 'horizontal' } },
        order: { field: 'score' },
        tooltip: [{ field: 'judge', title: 'Judge' }, { field: 'model', title: 'Model' }, { field: 'score', title: 'Score' }, { field: 'count', title: 'Times' }, { field: 'share', title: 'Share', format: '.1%' }],
      },
    }), 'Share of scores 0, 1 and 2 per judge and model');
    scale.append(tableDetails([
      { title: 'Judge', value: r => r.judge }, { title: 'Model', value: r => r.model }, { title: 'Score', num: true, value: r => r.score },
      { title: 'Times', num: true, value: r => r.count }, { title: 'Share', num: true, value: r => pct(r.share) },
    ], rows, 'Scores given per judge and model'));
  }

  function judgeCoverageCard(ctx, parent) {
    const { primary, byModel } = ctx;
    const versus = card(parent, `Coverage and the judge: ${primary}`,
      'The same runs, measured twice. Core coverage (deterministic) counts whether the expected references are cited; ' +
      'the judge\'s LegalReference score (independent) also asks whether they are applied correctly. A model can lead on one and trail on the other.');
    // Side by side as two proportions, never on one axis: coverage and the judge's full-score rate,
    // and whether they put the models in the same order.
    const comparison = data.judgeSummaries
      .filter(s => s.judgeModel === primary && s.variant === 'Independent' && byModel[s.score.model])
      .map(s => ({ model: byModel[s.score.model], coverage: byModel[s.score.model].score.meanCoreCoverage, fullScore: s.score.fullScoreLegalReferenceRate }))
      .sort((a, b) => ctx.models.indexOf(a.model) - ctx.models.indexOf(b.model));
    const order = field => [...comparison].sort((a, b) => (b[field] ?? -1) - (a[field] ?? -1)).map(c => c.model.shortName);
    const byCoverage = order('coverage');
    const byJudge = order('fullScore');
    const sameOrder = byCoverage.join('|') === byJudge.join('|');
    if (comparison.length > 1) {
      versus.append(table([
        { title: 'Model', wrap: true, value: c => modelCell(c.model) },
        { title: 'Core coverage', num: true, value: c => pct(c.coverage) },
        { title: 'Rank', num: true, value: c => byCoverage.indexOf(c.model.shortName) + 1 },
        { title: 'LegalReference full score', num: true, value: c => pct(c.fullScore) },
        { title: 'Rank', num: true, value: c => byJudge.indexOf(c.model.shortName) + 1 },
      ], comparison, 'Coverage and the judge\'s full-score rate per model'));
      versus.append(el('p', { class: 'how', style: 'margin-top:8px' }, sameOrder
        ? 'Coverage and the judge rank the models in the same order.'
        : `The rankings differ: by coverage ${byCoverage.join(', ')}; by the judge ${byJudge.join(', ')}.`));
    }

    const judgedRunIds = new Set(ctx.of(primary, 'Independent').map(s => s.runId));
    const coverageRuns = data.runs.filter(r => judgedRunIds.has(r.runId)).map(r => ({ ...r, shortName: byModel[r.model].shortName }));
    const judgedModels = t2 => ctx.withColors(t2).filter(m => coverageRuns.some(r => r.model === m.model));
    const runTip = (field, title, format) => [{ field: 'shortName', title: 'Model' }, { field: 'caseId', title: 'Contract' }, { field: 'repeat', title: 'Repeat' }, { field, title, format }];
    chartTitle(versus, 'Core coverage per run');
    chart(versus, t2 => stripSpec(t2, { points: coverageRuns, field: 'coreCoverage', models: judgedModels(t2), domain: [0, 1], format: '.1%', axisFormat: '.0%', offsetField: 'caseId', tooltip: runTip('coreCoverage', 'Core coverage', '.1%') }), 'Core coverage per judged run');
    chartTitle(versus, `LegalReference per run (${primary}, independent)`);
    chart(versus, t2 => stripSpec(t2, { points: ctx.runRows.Independent, field: 'legalReference', models: judgedModels(t2), domain: [0, 2], format: '.2f', axisFormat: '.1f', offsetField: 'caseId', tooltip: runTip('legalReference', 'LegalReference', '.2f') }), 'LegalReference score per judged run');
    const rows = coverageRuns.map(r => ({ ...r, legalReference: ctx.runRows.Independent.find(x => x.runId === r.runId)?.legalReference }));
    versus.append(tableDetails([
      { title: 'Model', value: r => r.shortName }, { title: 'Contract', value: r => r.caseId }, { title: 'Repeat', num: true, value: r => r.repeat },
      { title: 'Core coverage', num: true, value: r => pct(r.coreCoverage) }, { title: 'LegalReference', num: true, value: r => score(r.legalReference) },
    ], rows, 'Coverage and LegalReference per run'));
  }

  // ── Page: judge variants ─────────────────────────────────────────────────
  const DIRECTIONS = [
    { key: 'lowered', label: 'lowered by the list' },
    { key: 'same', label: 'unchanged' },
    { key: 'raised', label: 'raised by the list' },
  ];
  const directionOf = difference => {
    if (difference > 0) return 'raised';
    return difference < 0 ? 'lowered' : 'same';
  };

  /**
   * The independent judge against the variant that saw the expected references for LegalReference,
   * over the sections both variants of one judge scored, per judge and generator model.
   */
  function renderVariantsPage(page, main) {
    const models = modelsFor(page);
    const byModel = Object.fromEntries(models.map(m => [m.model, m]));
    const judged = data.judgeSections.filter(s => byModel[s.model] && s.judged);
    const judges = orderedJudges(judged);
    const key = s => `${s.judgeModel}|${s.runId}|${s.section}`;
    const withList = new Map(judged.filter(s => s.variant === 'Profile').map(s => [key(s), s]));
    const pairs = judged
      .filter(s => s.variant === 'Independent' && withList.has(key(s)))
      .map(s => ({ judge: s.judgeModel, model: byModel[s.model], section: s.section, independent: s, profile: withList.get(key(s)) }));
    const groups = judges
      .flatMap(judge => models.map(model => ({ judge, model, pairs: pairs.filter(p => p.judge === judge && p.model === model) })))
      .filter(g => g.pairs.length > 0)
      .map(g => ({ ...g, label: `${g.judge} · ${g.model.shortName}` }));
    const judgeColor = (t2, judge) => t2.series[JUDGE_SLOTS[judges.indexOf(judge) % JUDGE_SLOTS.length]];

    card(main, 'About this comparison').append(el('ul', { class: 'notes' },
      el('li', null, 'Each judge scored the same sections twice: independently, and with the curated list of expected references for the section and MRG scope, ' +
        'shown inside the LegalReference dimension only, as a reference list rather than ground truth.'),
      el('li', null, 'If the two variants agree, the list adds little beyond the deterministic coverage metric. Where they differ, either the list or the judge is wrong.'),
      el('li', null, 'ClauseCitationAccuracy and IRAC should not move: the list is not shown for them. Movement there means the list influenced the judge beyond LegalReference.'),
    ));
    variantsSummaryCard(main, groups);
    variantsMovementCard(main, groups);
    variantsRateCard(main, groups, judgeColor);
    variantsSectionCard(main, groups, judgeColor);
    card(main, 'How to read this page').append(el('ul', { class: 'notes' },
      el('li', null, 'Differences are the variant with the list minus the independent judge, on the 0–2 scale; a positive LegalReference difference means the list raised the score.'),
      el('li', null, 'A model whose LegalReference rises strongly with the list cites the expected references, but its use of them convinces the independent judge less.'),
      el('li', null, `In ${data.mode} runs the list is the set of references the graph gave the analysis, so this variant checks the analysis against its own input.`),
      el('li', null, 'judge_variant_sections.csv lists every section with both variants\' LegalReference findings; it quotes the contracts, so it stays out of this report.'),
    ));
  }

  /** Legend for the two variants: hollow for the independent judge, filled with the list. */
  function variantLegend() {
    return el('div', { class: 'legend', role: 'list', 'aria-label': 'Variants' },
      el('span', { role: 'listitem' }, el('span', { class: 'dot hollow', 'aria-hidden': 'true' }), 'independent'),
      el('span', { role: 'listitem' }, el('span', { class: 'dot', 'aria-hidden': 'true' }), 'with reference list'),
      el('span', null, 'colour: judge'));
  }

  function variantsSummaryCard(main, groups) {
    const rows = groups.map(g => {
      const difference = dim => mean(g.pairs.map(p => p.profile[dim] - p.independent[dim]));
      const fullScore = variant => g.pairs.filter(p => p[variant].legalReference === 2).length / g.pairs.length;
      const moves = g.pairs.map(p => directionOf(p.profile.legalReference - p.independent.legalReference));
      return {
        ...g,
        agreement: moves.filter(m => m === 'same').length / moves.length,
        raised: moves.filter(m => m === 'raised').length,
        lowered: moves.filter(m => m === 'lowered').length,
        fullIndependent: fullScore('independent'),
        fullProfile: fullScore('profile'),
        legalReference: difference('legalReference'),
        clauseCitationAccuracy: difference('clauseCitationAccuracy'),
        irac: difference('irac'),
      };
    });
    card(main, 'Summary',
      'Per judge and model, over the sections both variants scored. As in judge_variant_agreement.csv, plus how many LegalReference scores the list raised or lowered ' +
      'and the LegalReference full-score rate (share of sections scored 2) without and with the list.').append(table([
      { title: 'Judge', value: r => r.judge },
      { title: 'Model', wrap: true, value: r => modelCell(r.model) },
      { title: 'Sections', num: true, value: r => r.pairs.length },
      { title: 'LegalReference agreement', num: true, value: r => pct(r.agreement) },
      { title: 'Raised / lowered', num: true, value: r => `${r.raised} / ${r.lowered}` },
      { title: 'LegalReference full score', num: true, value: r => `${pct(r.fullIndependent, 0)} → ${pct(r.fullProfile, 0)}` },
      { title: 'LegalReference difference', num: true, value: r => signed(r.legalReference) },
      { title: 'ClauseCitationAccuracy difference', num: true, value: r => signed(r.clauseCitationAccuracy) },
      { title: 'IRAC difference', num: true, value: r => signed(r.irac) },
    ], rows, 'Agreement of the two judge variants'));
  }

  function variantsMovementCard(main, groups) {
    const movement = card(main, 'How the scores move',
      'Share of sections whose score the reference list lowered, left unchanged or raised, per dimension. ' +
      'Change is expected in LegalReference only.');
    movement.append(el('div', { class: 'legend', role: 'list', 'aria-label': 'Direction' },
      ...DIRECTIONS.map(d => el('span', { role: 'listitem' },
        el('span', { class: 'swatch', style: `background:var(--div-${d.key})`, 'aria-hidden': 'true' }), d.label))));

    const rows = groups.flatMap(g => DIMENSIONS.flatMap(dim => {
      const moves = g.pairs.map(p => directionOf(p.profile[dim.key] - p.independent[dim.key]));
      return DIRECTIONS.map((d, order) => {
        const count = moves.filter(m => m === d.key).length;
        return { group: g.label, dimension: dim.label, direction: d.key, label: d.label, order, count, share: count / moves.length };
      });
    }));

    const grid = el('div', { class: 'grid' });
    movement.append(grid);
    for (const g of groups) {
      const box = el('div');
      grid.append(box);
      chartTitle(box, g.label);
      chart(box, t2 => ({
        height: { step: 30 },
        data: { values: rows.filter(r => r.group === g.label && r.count > 0) },
        mark: { type: 'bar', size: 18, stroke: t2.surface, strokeWidth: 2 },
        encoding: {
          y: { field: 'dimension', type: 'nominal', sort: DIMENSIONS.map(d => d.label), title: null, axis: { labelLimit: 170 } },
          x: { field: 'count', type: 'quantitative', stack: 'normalize', title: null, axis: { format: '.0%', tickCount: t2.narrow ? 3 : 5 } },
          color: { field: 'direction', type: 'nominal', scale: { domain: DIRECTIONS.map(d => d.key), range: DIRECTIONS.map(d => t2.direction[d.key]) }, legend: null },
          order: { field: 'order' },
          tooltip: [{ field: 'dimension', title: 'Dimension' }, { field: 'label', title: 'Score' }, { field: 'count', title: 'Sections' }, { field: 'share', title: 'Share', format: '.1%' }],
        },
      }), `How the reference list moves the scores: ${g.label}`);
    }

    const tableRows = groups.flatMap(g => DIMENSIONS.map(dim => {
      const count = key => rows.find(r => r.group === g.label && r.dimension === dim.label && r.direction === key).count;
      return { group: g.label, dimension: dim.label, lowered: count('lowered'), same: count('same'), raised: count('raised') };
    }));
    movement.append(tableDetails([
      { title: 'Judge · model', value: r => r.group }, { title: 'Dimension', value: r => r.dimension },
      { title: 'Lowered', num: true, value: r => r.lowered }, { title: 'Unchanged', num: true, value: r => r.same }, { title: 'Raised', num: true, value: r => r.raised },
    ], tableRows, 'Sections lowered, unchanged and raised by the reference list'));
  }

  /** One row per item: a grey line from the independent value (hollow) to the value with the list (filled). */
  function dumbbellSpec(t2, values, { y, sort, domain, format, axisFormat, colorOf, tooltipTitle }) {
    const x = { type: 'quantitative', scale: { domain, nice: false }, title: null, axis: { format: axisFormat, tickCount: t2.narrow ? 3 : 5 } };
    const tooltip = [{ field: y, title: '' }, { field: 'judge', title: 'Judge' }, { field: 'independent', title: `${tooltipTitle}, independent`, format }, { field: 'profile', title: `${tooltipTitle}, with list`, format }];
    return {
      height: { step: 28 },
      data: { values: values.map(v => ({ ...v, color: colorOf(t2, v.judge) })) },
      encoding: { y: { field: y, type: 'nominal', sort, title: null, axis: { labelLimit: labelLimit(t2) + 60 } } },
      layer: [
        { mark: { type: 'rule', color: t2.axis, strokeWidth: 2 }, encoding: { x: { ...x, field: 'independent' }, x2: { field: 'profile' } } },
        { mark: { type: 'point', filled: false, size: 100, strokeWidth: 2, opacity: 1 }, encoding: { x: { ...x, field: 'independent' }, color: { field: 'color', type: 'nominal', scale: null }, tooltip } },
        { mark: { type: 'point', filled: true, size: 100, opacity: 1, stroke: t2.surface, strokeWidth: 1 }, encoding: { x: { ...x, field: 'profile' }, color: { field: 'color', type: 'nominal', scale: null }, tooltip } },
      ],
    };
  }

  function variantsRateCard(main, groups, judgeColor) {
    const rates = card(main, 'Full-score rate without and with the list',
      'Share of sections scored 2, per dimension: hollow for the independent judge, filled with the reference list. ' +
      'A long line in LegalReference is a model the list lifts; a line in the other two dimensions is movement the list should not cause.');
    rates.append(variantLegend());
    const rows = groups.flatMap(g => DIMENSIONS.map(dim => ({
      group: g.label, judge: g.judge, dimension: dim.label,
      independent: g.pairs.filter(p => p.independent[dim.key] === 2).length / g.pairs.length,
      profile: g.pairs.filter(p => p.profile[dim.key] === 2).length / g.pairs.length,
    })));
    const grid = el('div', { class: 'grid' });
    rates.append(grid);
    for (const dim of DIMENSIONS) {
      const box = el('div');
      grid.append(box);
      chartTitle(box, dim.label);
      chart(box, t2 => dumbbellSpec(t2, rows.filter(r => r.dimension === dim.label), {
        y: 'group', sort: groups.map(g => g.label), domain: [0, 1], format: '.1%', axisFormat: '.0%', colorOf: judgeColor, tooltipTitle: 'Full score',
      }), `${dim.label} full-score rate without and with the reference list`);
    }
    rates.append(tableDetails([
      { title: 'Judge · model', value: r => r.group }, { title: 'Dimension', value: r => r.dimension },
      { title: 'Independent', num: true, value: r => pct(r.independent) }, { title: 'With list', num: true, value: r => pct(r.profile) },
    ], rows, 'Full-score rate without and with the reference list'));
  }

  function variantsSectionCard(main, groups, judgeColor) {
    const bySection = card(main, 'Where the list changes LegalReference',
      'Mean LegalReference score per section (0 to 2): hollow for the independent judge, filled with the reference list.');
    bySection.append(variantLegend());
    const rows = groups.flatMap(g => SECTION_ORDER.flatMap(section => {
      const own = g.pairs.filter(p => p.section === section);
      if (own.length === 0) return [];
      return [{
        group: g.label, judge: g.judge, section, n: own.length,
        independent: mean(own.map(p => p.independent.legalReference)),
        profile: mean(own.map(p => p.profile.legalReference)),
      }];
    }));
    const grid = el('div', { class: 'grid' });
    bySection.append(grid);
    for (const g of groups) {
      const box = el('div');
      grid.append(box);
      chartTitle(box, g.label);
      chart(box, t2 => dumbbellSpec(t2, rows.filter(r => r.group === g.label), {
        y: 'section', sort: SECTION_ORDER, domain: [0, 2], format: '.2f', axisFormat: '.1f', colorOf: judgeColor, tooltipTitle: 'LegalReference',
      }), `LegalReference per section without and with the reference list: ${g.label}`);
    }
    bySection.append(tableDetails([
      { title: 'Judge · model', value: r => r.group }, { title: 'Section', value: r => r.section },
      { title: 'Independent', num: true, value: r => score(r.independent) }, { title: 'With list', num: true, value: r => score(r.profile) },
      { title: 'Difference', num: true, value: r => signed(r.profile - r.independent) }, { title: 'Runs', num: true, value: r => r.n },
    ], rows, 'LegalReference per section without and with the reference list'));
  }

  /** The same runs of one model, scored by several judges: mean per section and dimension, one mark per judge. */
  function renderJudgeComparison(ctx, main, model, judges) {
    const { judgeSlot, judgeShape } = ctx;
    const own = judge => ctx.of(judge, 'Independent').filter(s => s.model === model.model);
    const comparison = card(main, `Two judges on the same runs: ${model.shortName}`,
      'Mean score per section for each judge (independent variant). The grey line spans the judges\' means; a long line is a section the judges see differently.');
    comparison.append(el('div', { class: 'legend', role: 'list', 'aria-label': 'Judges' }, el('span', { class: 'legend-title' }, 'Judge'),
      ...judges.map(j => el('span', { role: 'listitem' }, el('span', { class: 'swatch', style: `background:var(--series-${judgeSlot(j) + 1})`, 'aria-hidden': 'true' }), j))));

    const points = judges.flatMap(judge => sectionMeans(own(judge)).map(p => ({ ...p, judge })));

    // Exact agreement over the sections both judges scored, per dimension.
    const [first, second] = judges;
    const firstScores = Object.fromEntries(own(first).map(s => [s.runId + '|' + s.section, s]));
    const both = own(second).filter(s => firstScores[s.runId + '|' + s.section]);
    const facts = DIMENSIONS.map(d => {
      const same = both.filter(s => s[d.key] === firstScores[s.runId + '|' + s.section][d.key]).length;
      const lower = both.filter(s => s[d.key] < firstScores[s.runId + '|' + s.section][d.key]).length;
      return `${d.label}: same score in ${same} of ${both.length} sections, ${second} lower in ${lower}`;
    });
    comparison.append(el('ul', { class: 'notes' }, ...facts.map(f => el('li', null, f + '.'))));

    const grid = el('div', { class: 'grid' });
    comparison.append(grid);
    for (const dim of DIMENSIONS) {
      const box = el('div');
      grid.append(box);
      chartTitle(box, dim.label);
      const values = points.filter(p => p.dimension === dim.label);
      chart(box, t2 => ({
        height: { step: 28 },
        data: { values },
        encoding: { y: { field: 'section', type: 'nominal', sort: SECTION_ORDER, title: null } },
        layer: [
          {
            mark: { type: 'rule', color: t2.axis, strokeWidth: 2 },
            encoding: { x: { aggregate: 'min', field: 'value', type: 'quantitative', scale: { domain: [0, 2] } }, x2: { aggregate: 'max', field: 'value' } },
          },
          {
            mark: { type: 'point', filled: true, size: 110, opacity: 1, stroke: t2.surface, strokeWidth: 1.5 },
            encoding: {
              x: { field: 'value', type: 'quantitative', title: null, scale: { domain: [0, 2] }, axis: { format: '.1f', tickCount: 5 } },
              color: { field: 'judge', type: 'nominal', scale: { domain: judges, range: judges.map(j => t2.series[judgeSlot(j)]) }, legend: null },
              shape: { field: 'judge', type: 'nominal', scale: { domain: judges, range: judges.map(judgeShape) }, legend: null },
              tooltip: [{ field: 'judge', title: 'Judge' }, { field: 'section', title: 'Section' }, { field: 'value', title: dim.label, format: '.2f' }, { field: 'n', title: 'Runs' }],
            },
          },
        ],
      }), `${dim.label} per section, by judge`);
    }
    comparison.append(tableDetails([
      { title: 'Judge', value: p => p.judge }, { title: 'Dimension', value: p => p.dimension }, { title: 'Section', value: p => p.section },
      { title: 'Mean', num: true, value: p => score(p.value) }, { title: 'Runs', num: true, value: p => p.n },
    ], points, 'Judge means per section'));
  }

  const signed = v => {
    if (v == null) return '–';
    return (v > 0 ? '+' : '') + Number(v).toFixed(2);
  };

  // ── Page: thesis (June 2026) ─────────────────────────────────────────────
  const thesisLabel = (model, mode) => `${model} · ${mode}`;

  /** The thesis rows: one per model and mode (stage), coloured by provider like the current models. */
  function thesisGroups(thesis) {
    const providerOf = Object.fromEntries(thesis.contracts.map(c => [c.model, c.provider]));
    const groups = new Map();
    for (const x of [...thesis.contracts, ...thesis.judgeSections])
      groups.set(thesisLabel(x.model, x.mode), { model: x.model, mode: x.mode, stage: x.stage });
    return [...groups.values()]
      .sort((a, b) => a.model.localeCompare(b.model) || a.stage - b.stage)
      .map(g => {
        const provider = providerOf[g.model] ?? 'other';
        const slot = providerSlot(provider);
        return { ...g, provider, slot, shortName: thesisLabel(g.model, g.mode), color: `var(--series-${slot + 1})` };
      });
  }

  function thesisScope() {
    const thesis = data.thesis;
    const contracts = [...new Set(thesis.contracts.map(c => c.caseId))].sort();
    const models = [...new Set(thesis.contracts.map(c => c.model))];
    return `Stages 1–3 = PromptOnly, FileCag, GraphProfile · contracts ${contracts.join(', ')} · ${listText(models)} · ` +
      `judge ${listText(thesis.judgeModels)} (${listText(thesis.promptVersions)}).`;
  }

  /** Judge means of one contract: the mean over its judged sections, as in the thesis tables. */
  function thesisJudgeContracts(thesis, groups) {
    const rows = [];
    for (const g of groups) {
      const own = thesis.judgeSections.filter(s => s.model === g.model && s.mode === g.mode && s.judged);
      for (const caseId of [...new Set(own.map(s => s.caseId))].sort()) {
        const list = own.filter(s => s.caseId === caseId);
        rows.push({
          shortName: g.shortName, model: g.model, mode: g.mode, caseId, sections: list,
          legalReference: mean(list.map(s => s.legalReference)),
          clauseCitationAccuracy: mean(list.map(s => s.clauseCitationAccuracy)),
          irac: mean(list.map(s => s.irac)),
          overall: mean(list.map(s => (s.legalReference + s.clauseCitationAccuracy + s.irac) / 3)),
        });
      }
    }
    return rows;
  }

  function renderThesisPage(page, main) {
    const thesis = data.thesis;
    const groups = thesisGroups(thesis);
    const withColors = t2 => groups.map(g => ({ ...g, color: t2.series[g.slot] }));
    const contracts = thesis.contracts.map(c => ({ ...c, shortName: thesisLabel(c.model, c.mode) }));
    const judgeContracts = thesisJudgeContracts(thesis, groups);

    providerLegend(main, [...new Set(groups.map(g => g.provider))].sort((a, b) => providerSlot(a) - providerSlot(b)));
    card(main, 'About the thesis evaluation').append(el('ul', { class: 'notes' },
      el('li', null, 'The bachelor thesis compared the three retrieval modes as stages: 1 PromptOnly, 2 FileCag, 3 GraphProfile. ' +
        'GPT-4.1 ran in every mode, Llama 70B in PromptOnly, on the same three contracts as today.'),
      el('li', null, 'Deterministic metrics come from three repeated runs per contract (two for MV2 in GraphProfile). ' +
        'The judge scored one run per contract, so each judge value below rests on six sections.'),
      el('li', null, 'Judge scores are shown on the rubric\'s 0–2 scale, like the current judge pages. The thesis reported them divided by 2; ' +
        'the values are otherwise identical, and the full-score rate is added from the saved section scores.'),
      el('li', null, 'ClauseCitationAccuracy is low because of the strict system rules in place at the time.'),
      el('li', null, 'Not comparable with today: consistency was measured on the older clause rating (Konform, Nachteilhaft, Abweichend), not riskLevel; ' +
        'the judge was another model with prompt v1, which still saw that rating; quote traceability was not measured yet.'),
    ));

    thesisSummaryCard(main, groups, contracts, judgeContracts, thesis);

    const grid = el('div', { class: 'grid' });
    main.append(grid);
    const coverage = card(grid, 'Reference coverage by mode',
      'Same metric and expected references as today. Each dot is one contract (mean of its runs); the dark line is the mean.');
    const contractTip = (field, title, format) => [{ field: 'shortName', title: 'Model · mode' }, { field: 'caseId', title: 'Contract' }, { field: 'runs', title: 'Runs' }, { field, title, format }];
    chartTitle(coverage, 'Core coverage');
    chart(coverage, t2 => stripSpec(t2, { points: contracts, field: 'coreCoverage', models: withColors(t2), domain: [0, 1], format: '.1%', axisFormat: '.0%', tooltip: contractTip('coreCoverage', 'Core coverage', '.1%') }), 'Thesis core coverage per contract and mode');
    chartTitle(coverage, 'Weighted score');
    chart(coverage, t2 => stripSpec(t2, { points: contracts, field: 'weightedScore', models: withColors(t2), domain: [0, 1], format: '.1%', axisFormat: '.0%', tooltip: contractTip('weightedScore', 'Weighted score', '.1%') }), 'Thesis weighted score per contract and mode');
    coverage.append(tableDetails([
      { title: 'Model · mode', value: c => c.shortName }, { title: 'Contract', value: c => c.caseId }, { title: 'Runs', num: true, value: c => c.runs },
      { title: 'Core coverage', num: true, value: c => pct(c.coreCoverage) }, { title: 'Weighted score', num: true, value: c => pct(c.weightedScore) },
      { title: 'Plain Jaccard', num: true, value: c => pct(c.plainJaccard) },
    ], contracts, 'Thesis coverage per contract'));

    const judge = card(grid, `Judge scores by mode: ${listText(thesis.judgeModels)}`,
      'On the 0–2 rubric scale. Each dot is one contract (mean of its six judged sections); the dark line is the mean.');
    const judgeTip = (field, title) => [{ field: 'shortName', title: 'Model · mode' }, { field: 'caseId', title: 'Contract' }, { field, title, format: '.2f' }];
    for (const dim of [...DIMENSIONS, { key: 'overall', label: 'Overall' }]) {
      chartTitle(judge, dim.label);
      chart(judge, t2 => stripSpec(t2, { points: judgeContracts, field: dim.key, models: withColors(t2), domain: [0, 2], format: '.2f', axisFormat: '.1f', tooltip: judgeTip(dim.key, dim.label) }), `Thesis judge ${dim.label} per contract and mode`);
    }
    judge.append(tableDetails([
      { title: 'Model · mode', value: r => r.shortName }, { title: 'Contract', value: r => r.caseId },
      ...DIMENSIONS.map(d => ({ title: d.label, num: true, value: r => score(r[d.key]) })),
      { title: 'Overall', num: true, value: r => score(r.overall) },
    ], judgeContracts, 'Thesis judge scores per contract'));

    thesisSectionCard(main, groups, thesis);
    thesisThenAndNowCard(main, thesis);

    card(main, 'How to read this page').append(el('ul', { class: 'notes' },
      el('li', null, 'The thesis numbers are recomputed from its saved response files, the same way its scripts computed them; the stage means match the thesis tables.'),
      el('li', null, 'Across modes, the graph overlap applies here too: GraphProfile retrieves exactly the references the coverage metric expects.'),
      el('li', null, 'With three contracts and one judged run per contract, differences of a few hundredths in a judge score are not meaningful.'),
    ));
  }

  function thesisSummaryCard(main, groups, contracts, judgeContracts, thesis) {
    const rows = groups.map(g => {
      const own = contracts.filter(c => c.model === g.model && c.mode === g.mode);
      const judged = judgeContracts.filter(r => r.model === g.model && r.mode === g.mode);
      const sections = judged.flatMap(r => r.sections);
      const fullScore = key => sections.length ? sections.filter(s => s[key] === 2).length / sections.length : null;
      const stable = own.filter(c => c.overallRatingStable != null);
      return {
        group: g, runs: own.reduce((s, c) => s + c.runs, 0),
        coreCoverage: mean(own.map(c => c.coreCoverage)), weightedScore: mean(own.map(c => c.weightedScore)),
        plainJaccard: mean(own.map(c => c.plainJaccard)), clauseRating: mean(own.map(c => c.clauseRatingConsistency)),
        citationJaccard: mean(own.map(c => c.citationJaccard)),
        stable: stable.length ? stable.filter(c => c.overallRatingStable).length / stable.length : null,
        guardrails: mean(own.map(c => c.meanGuardrailViolations)),
        legalReference: mean(judged.map(r => r.legalReference)), clauseCitationAccuracy: mean(judged.map(r => r.clauseCitationAccuracy)),
        irac: mean(judged.map(r => r.irac)), overall: mean(judged.map(r => r.overall)),
        fullLegalReference: fullScore('legalReference'), fullClauseCitationAccuracy: fullScore('clauseCitationAccuracy'), fullIrac: fullScore('irac'),
      };
    });
    const withRate = (value, rate) => value == null ? '–' : `${score(value)} (${pct(rate, 0)})`;
    card(main, 'Summary',
      'Means over the contracts per model and mode, as in the thesis tables. Judge columns: mean score (0–2) with the full-score rate in brackets. ' +
      'Clause-rating consistency uses the older rating and is not comparable with riskLevel consistency.').append(table([
      { title: 'Model', wrap: true, value: r => el('span', null, el('span', { class: 'swatch', style: 'background:' + r.group.color, 'aria-hidden': 'true' }), r.group.model, el('span', { class: 'sub' }, `${r.group.mode} (stage ${r.group.stage}) · ${r.group.provider}`)) },
      { title: 'Runs', num: true, value: r => r.runs },
      { title: 'Core coverage', num: true, value: r => pct(r.coreCoverage) },
      { title: 'Weighted score', num: true, value: r => pct(r.weightedScore) },
      { title: 'Clause-rating consistency', num: true, value: r => pct(r.clauseRating) },
      { title: 'Citation Jaccard', num: true, value: r => pct(r.citationJaccard) },
