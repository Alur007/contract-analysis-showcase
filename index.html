      { title: 'Overall rating stable', num: true, value: r => pct(r.stable, 0) },
      { title: 'Guardrail hits / run', num: true, value: r => num(r.guardrails, 2) },
      { title: 'LegalReference (full score)', num: true, value: r => withRate(r.legalReference, r.fullLegalReference) },
      { title: 'ClauseCitationAccuracy (full score)', num: true, value: r => withRate(r.clauseCitationAccuracy, r.fullClauseCitationAccuracy) },
      { title: 'IRAC (full score)', num: true, value: r => withRate(r.irac, r.fullIrac) },
      { title: 'Judge overall', num: true, value: r => r.overall == null ? '–' : score(r.overall) },
    ], rows, 'Thesis results per model and mode'));
  }

  function thesisSectionCard(main, groups, thesis) {
    const bySection = card(main, 'Weighted score by section',
      'Mean weighted score per section over the contracts and runs, per model and mode (the thesis\'s section heatmap).');
    const cells = groups.flatMap(g => SECTION_ORDER.flatMap(section => {
      const own = thesis.sections.filter(s => s.model === g.model && s.mode === g.mode && s.section === section && s.weightedScore != null);
      return own.length ? [{ row: g.shortName, section, value: mean(own.map(s => s.weightedScore)), core: mean(own.map(s => s.coreCoverage)), n: own.reduce((s, x) => s + x.runs, 0) }] : [];
    }));
    chart(bySection, t2 => ({
      height: { step: 36 },
      data: { values: cells },
      encoding: {
        x: { field: 'section', type: 'nominal', sort: SECTION_ORDER, title: null, axis: { orient: 'top', labelAngle: 0, domain: false, ticks: false } },
        y: { field: 'row', type: 'nominal', sort: groups.map(g => g.shortName), title: null, axis: { labelLimit: 220 } },
      },
      layer: [
        {
          mark: { type: 'rect', stroke: t2.surface, strokeWidth: 2, cornerRadius: 4 },
          encoding: {
            color: { field: 'value', type: 'quantitative', scale: { domain: [0, 1], range: t2.seq }, legend: { title: 'Mean weighted score', format: '.0%', values: [0, 0.5, 1], orient: 'bottom', gradientLength: 220, direction: 'horizontal' } },
            tooltip: [{ field: 'row', title: 'Model · mode' }, { field: 'section', title: 'Section' }, { field: 'value', title: 'Weighted score', format: '.1%' }, { field: 'core', title: 'Core coverage', format: '.1%' }, { field: 'n', title: 'Runs' }],
          },
        },
        {
          mark: { type: 'text', fontSize: 12 },
          encoding: {
            text: { field: 'value', type: 'quantitative', format: '.0%' },
            color: { condition: { test: 'datum.value >= 0.6', value: t2.seqLabelHigh }, value: t2.seqLabelLow },
          },
        },
      ],
    }), 'Thesis weighted score per section, model and mode', 700);
    bySection.append(tableDetails([
      { title: 'Model · mode', value: c => c.row }, { title: 'Section', value: c => c.section },
      { title: 'Weighted score', num: true, value: c => pct(c.value) }, { title: 'Core coverage', num: true, value: c => pct(c.core) }, { title: 'Runs', num: true, value: c => c.n },
    ], cells, 'Thesis weighted score per section'));
  }

  /**
   * The thesis GraphProfile runs next to today's, on the deterministic coverage only: the metric and
   * the expected references are unchanged, while the judge and the consistency rating are not.
   */
  function thesisThenAndNowCard(main, thesis) {
    if (data.mode !== 'GraphProfile') return;
    const then = thesis.contracts.filter(c => c.mode === 'GraphProfile');
    if (then.length === 0 || data.models.length === 0) return;

    const nowModels = modelsFor({ models: () => true });
    const thenModels = [...new Set(then.map(c => c.model))].map(model => {
      const slot = providerSlot(then.find(c => c.model === model).provider);
      return { shortName: `${model} (thesis)`, slot };
    });
    const rows = [...thenModels, ...nowModels.map(m => ({ shortName: m.shortName, slot: m.slot }))];
    const points = [
      ...then.map(c => ({ shortName: `${c.model} (thesis)`, caseId: c.caseId, coreCoverage: c.coreCoverage, weightedScore: c.weightedScore, runs: c.runs })),
      ...nowModels.flatMap(m => [...new Set(data.runs.filter(r => r.model === m.model).map(r => r.caseId))].sort().map(caseId => {
        const runs = data.runs.filter(r => r.model === m.model && r.caseId === caseId);
        return { shortName: m.shortName, caseId, coreCoverage: mean(runs.map(r => r.coreCoverage)), weightedScore: mean(runs.map(r => r.weightedScore)), runs: runs.length };
      })),
    ];
    const withColors = t2 => rows.map(r => ({ ...r, color: t2.series[r.slot] }));

    const thenNow = card(main, 'Then and now: GraphProfile coverage',
      'The thesis model in GraphProfile next to today\'s models, on the deterministic coverage only: the metric and the expected references are unchanged. ' +
      'Each dot is one contract (mean of its runs). The judge scores are not compared, because the judge model and prompt changed.');
    const tip = (field, title) => [{ field: 'shortName', title: 'Model' }, { field: 'caseId', title: 'Contract' }, { field: 'runs', title: 'Runs' }, { field, title, format: '.1%' }];
    const grid = el('div', { class: 'grid' });
    thenNow.append(grid);
    for (const [field, title] of [['coreCoverage', 'Core coverage'], ['weightedScore', 'Weighted score']]) {
      const box = el('div');
      grid.append(box);
      chartTitle(box, title);
      chart(box, t2 => stripSpec(t2, { points, field, models: withColors(t2), domain: [0, 1], format: '.1%', axisFormat: '.0%', tooltip: tip(field, title) }), `${title}: thesis and current models in GraphProfile`);
    }
    thenNow.append(el('p', { class: 'how', style: 'margin-top:8px' },
      'The thesis counted a failed section as coverage 0; the current tool leaves it out and counts it. Generator settings differ as well (GPT-4.1 ran at temperature 0).'));
    thenNow.append(tableDetails([
      { title: 'Model', value: p => p.shortName }, { title: 'Contract', value: p => p.caseId }, { title: 'Runs', num: true, value: p => p.runs },
      { title: 'Core coverage', num: true, value: p => pct(p.coreCoverage) }, { title: 'Weighted score', num: true, value: p => pct(p.weightedScore) },
    ], points, 'Coverage per contract, thesis and current models'));
  }

  function settings(m) {
    return [
      m.provider,
      m.reasoningEffort ? 'reasoning ' + m.reasoningEffort : 'reasoning: model default',
      'temp ' + m.temperature,
      m.maxOutputTokens.map(v => compact(v)).join('/') + ' token limit',
      concurrencyOfModel(m),
    ].join(' · ');
  }

  /** Nebius sends all sections at once; the OpenAI client (also for Gemini) has a limit, recorded since 2026-11-24. */
  function concurrencyText(provider, limit) {
    if (limit != null) return `${limit} call${limit === 1 ? '' : 's'} at once`;
    return provider === 'Nebius' ? 'all sections at once' : 'calls at once not recorded';
  }

  function concurrencyOfModel(m) {
    if (m.concurrency.length === 1) return concurrencyText(m.provider, m.concurrency[0].maxConcurrentRequests);
    return m.concurrency
      .map(c => `${concurrencyText(m.provider, c.maxConcurrentRequests)} (${c.runs} run${c.runs === 1 ? '' : 's'})`)
      .join(', ');
  }

  function concurrencyOfRun(m, run) {
    return concurrencyText(m.provider, run.maxConcurrentRequests);
  }

  // ── Shell ────────────────────────────────────────────────────────────────
  function render() {
    const main = document.getElementById('page');
    main.replaceChildren();
    charts.length = 0;

    if (PAGES.length === 0) {
      main.append(el('p', null, 'No page of this report applies to the stored runs.'));
      return;
    }

    const page = PAGES.find(p => '#' + p.id === location.hash) || PAGES[0];
    document.getElementById('page-title').textContent = page.title;
    document.title = page.title + ' · Rental evaluation';

    const pageModels = data.models.filter(page.models);
    const runCount = pageModels.reduce((s, m) => s + m.score.runs, 0);
    document.getElementById('page-scope').textContent = page.scope
      ? page.scope()
      : `${data.mode} mode · contracts ${data.cases.map(c => `${c.caseId} (${c.scope})`).join(', ')} · ` +
        `${runCount} runs of ${pageModels.length} models, at least ${data.minRunsPerCase} per contract.`;

    const nav = document.getElementById('page-nav');
    nav.replaceChildren(...PAGES.map(p => el('a', { href: '#' + p.id, 'aria-current': p === page ? 'page' : null }, p.nav)));
    nav.hidden = PAGES.length < 2;

    page.render(page, main);
    // The data notes are about the current runs; pages with their own data (the thesis) leave them out.
    if (!page.available) renderDataNotes(main);
    drawCharts();
  }

  function renderDataNotes(main) {
    const items = [];
    for (const e of data.excluded)
      items.push(`Left out: ${e.model}, ${e.reason} (at least ${data.minRunsPerCase} runs of every contract are needed).`);
    for (const w of data.warnings)
      items.push(w);
    if (items.length === 0) return;
    const notes = card(main, 'Data notes');
    notes.append(el('ul', { class: 'notes' }, ...items.map(text => el('li', null, text))));
  }

  function renderFooter() {
    const generated = new Date(data.generatedAt);
    document.getElementById('footer').append(
      el('p', null, `Generated ${generated.toISOString().slice(0, 16).replace('T', ' ')} UTC by the evaluation tool's report command.`),
      el('p', null, data.sourceRevisions.length
        ? `Analysis code revision${data.sourceRevisions.length > 1 ? 's' : ''}: ${data.sourceRevisions.join(', ')}.`
        : 'Analysis code revision: unknown.'),
      el('p', null, 'The report contains scores only, no contract or report text.'));
  }

  // Theme control
  const themeSelect = document.getElementById('theme');
  let saved = 'auto';
  try { saved = localStorage.getItem(THEME_KEY) || 'auto'; } catch (_) { /* storage unavailable */ }
  themeSelect.value = saved;
  applyTheme(saved);
  themeSelect.addEventListener('change', () => {
    applyTheme(themeSelect.value);
    try { localStorage.setItem(THEME_KEY, themeSelect.value); } catch (_) { /* storage unavailable */ }
    drawCharts();
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => drawCharts());
  // Vega follows the container width by itself; redraw only when a chart crosses the narrow breakpoint.
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (charts.some(c => c.narrow !== (c.node.clientWidth < NARROW))) drawCharts();
    }, 200);
  });
  window.addEventListener('hashchange', render);

  renderFooter();
  render();
})();
</script>
</body>
</html>
